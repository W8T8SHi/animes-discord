name: Notifications animes
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Envoyer un message de test sur Discord"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: anime
  cancel-in-progress: false
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Message de test
        if: ${{ inputs.test }}
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_MENTION: ${{ vars.DISCORD_MENTION }}
        run: python anime_discord.py --test
      - name: Vérifier les sorties
        if: ${{ !inputs.test }}
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_MENTION: ${{ vars.DISCORD_MENTION }}
          SUIVIS: ${{ vars.SUIVIS }}
          GRACE_MIN: "45"
        run: python anime_discord.py --once
      - name: Enregistrer les messages déjà envoyés
        if: ${{ !inputs.test }}
        run: |
          git config user.name "anime-bot"
          git config user.email "anime-bot@users.noreply.github.com"
          git add deja_envoyes.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "messages envoyés" && git push)
