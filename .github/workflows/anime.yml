name: Notifications animes

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: anime
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Vérifier les sorties
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_MENTION: ${{ vars.DISCORD_MENTION }}
          SUIVIS: ${{ vars.SUIVIS }}
          GRACE_MIN: "45"
        run: python anime_discord.py --once
      - name: Enregistrer les messages déjà envoyés
        run: |
          git config user.name "anime-bot"
          git config user.email "anime-bot@users.noreply.github.com"
          git add deja_envoyes.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "messages envoyés" && git push)
